  /five:
    get:
      description: get 500
      responses:
        '500':
          description: simulating 500
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
              examples:
                '0':
                  value: |
                    {"status":500}
  /four09:
    get:
      description: get 409
      responses:
        '500':
          description: simulating 409
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
              examples:
                '0':
                  value: |
