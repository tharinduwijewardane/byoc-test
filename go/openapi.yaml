openapi: 3.0.0
info:
  title: Inventory Service API
  version: 1.0.0
paths:
  /check_inventory/{productId}:
    get:
      summary: Check inventory for a product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the product to check inventory for
      responses:
        '200':
          description: Inventory check response
          content:
            application/json:
              schema:
                type: object
                properties:
                  in_stock:
                    type: boolean
                    description: Indicates if the product is in stock
