openapi: 3.0.0
info:
  title: Order Service API
  version: 1.0.0
paths:
  /place_order:
    post:
      summary: Place an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product_id:
                  type: string
                  example: "12345"
                quantity:
                  type: integer
                  example: 1
      responses:
        '200':
          description: Order response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Order placed successfully"
        '400':
          description: Invalid request payload
        '500':
          description: Failed to check inventory
