openapi: 3.1.0
info:
  title: Choreo BYOC Examples
  description: This repository contains demo API implemented in different frameworks to showcase capabilities of choreo.
  version: '0.1'
paths:
  /:
    get:
      description: Auto generated using Swagger Inspector
      responses:
        '200':
          description: Auto generated using Swagger Inspector
          content:
            application/json:
              schema:
                type: object
                properties:
                  healthy:
                    type: boolean
              examples:
                '0':
                  value: |
                    {"active":true}
  /gen-logs:
    get:
      description: Generates log entries with specified size, count, and delay between entries
      parameters:
        - name: bytesPerEntry
          in: query
          required: true
          schema:
            type: integer
            minimum: 11
          description: Size of each log entry in bytes (must be greater than 10)
        - name: entryCount
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
          description: Number of log entries to generate
        - name: sleepMsPerEntry
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
          description: Milliseconds to sleep between generating each entry
      responses:
        '202':
          description: Log generation started successfully
          content:
            text/plain:
              schema:
                type: string
                example: Log generation started
        '400':
          description: Invalid query parameters
          content:
            text/plain:
              schema:
                type: string
                example: Invalid bytesPerEntry value in query params. Value must be greater than 10 because a single log entry of '{"msg":""}' uses 10 bytes
  /flood-logs:
    get:
      description: Continuously generates timestamp log entries for 2 minutes
      responses:
        '200':
          description: Log flooding started
          content:
            text/plain:
              schema:
                type: string
                example: Log flooding started
